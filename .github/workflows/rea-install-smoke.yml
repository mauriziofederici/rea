name: "REA - Verifica installazione npm"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-npm-cli:
    name: Avvio CLI REA (runner temporaneo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install official REA package from npm
        run: npm install --global rea-agents@latest
      - name: Verify installed CLI
        run: |
          rea --help
          npm ls --global rea-agents --depth=0
